[graph]
# We only target the architectures of the Kubernetes Linux nodes that we support
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-unknown-linux-gnu" },
]
all-features = true

[advisories]
version = 2
yanked = "deny"
# `cargo deny check` is a blocking CI gate, so surface unmaintained crates from
# every advisory source rather than only the RustSec-authored ones. This is what
# catches a dependency being archived upstream while it is still resolving fine.
unmaintained = "all"
ignore = [
    # rustls-pemfile is archived upstream; its functionality moved into
    # rustls-pki-types. It reaches us transitively through kube/reqwest, and the
    # latest release is a thin wrapper over the replacement, so there is nothing
    # to act on until those crates drop it.
    { id = "RUSTSEC-2025-0134", reason = "archived upstream; transitive through kube/reqwest, latest release wraps rustls-pki-types" },
]

[bans]
multiple-versions = "warn"
deny = [
    { name = "openssl" },
    { name = "openssl-sys" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    # Permissive, OSI-approved, and unavoidable: the ICU crates behind `idna`
    # (and therefore `url` and `reqwest`) are all Unicode-3.0.
    "Unicode-3.0",
    # Permissive. Reaches us through `foldhash` via `hashbrown`, and was
    # already granted per-crate to const_format below.
    "Zlib"
]
exceptions = [
    { name = "const_format", allow = ["Zlib"] },
    { name = "const_format_proc_macros", allow = ["Zlib"] },
    { name = "ring", allow = ["OpenSSL"] },
    { name = "unicode-ident", allow = ["Unicode-DFS-2016"] }
]

[[licenses.clarify]]
name = "ring"
# SPDX considers OpenSSL to encompass both the OpenSSL and SSLeay licenses
# https://spdx.org/licenses/OpenSSL.html
# ISC - Both BoringSSL and ring use this for their new files
# MIT - "Files in third_party/ have their own licenses, as described therein. The MIT
# license, for third_party/fiat, which, unlike other third_party directories, is
# compiled into non-test libraries, is included below."
# OpenSSL - Obviously
expression = "ISC AND MIT AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[licenses.private]
ignore = true
