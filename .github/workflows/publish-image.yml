# Builds the container images and publishes them to this fork's GitHub
# Container Registry namespace.
#
# Separate from release.yml, which is upstream's flow: it needs a GPG signing
# key, Nexus credentials, a release PAT and semantic-release, none of which
# exist on a fork. This workflow needs nothing but GITHUB_TOKEN.
name: publish-image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-image-${{ github.ref }}
  # Superseded PR builds are wasted work; superseded pushes to main are not,
  # because each one publishes an immutable sha- tag someone may already
  # reference.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: shulker-operator
            dockerfile: packages/shulker-operator/Dockerfile
          - name: shulker-addon-matchmaking
            dockerfile: packages/shulker-addon-matchmaking/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Installs Node and pnpm, and `pnpm install` runs the `prepare` script,
      # which is what generates the protobuf bindings. Rust is deliberately not
      # installed here -- the Dockerfile brings its own toolchain and compiles
      # inside the build. Java is, because the Nx graph loads the Gradle plugin
      # to resolve the buf targets.
      - name: Install tools
        uses: ./.github/actions/install-tools
        with:
          install-rust: "false"
          install-java: "true"

      # bindings/rust/src/gen is gitignored and generated by `buf`. A bare
      # `docker build` on a clean checkout compiles for ten minutes and then
      # fails on missing modules, so assert the bindings exist before handing
      # the context to buildx and turn that into a five-second failure.
      - name: Verify generated protobuf bindings
        run: |
          missing=0
          for pkg in google-agones-sdk google-open-match-sdk shulker-sdk; do
            dir="packages/${pkg}/bindings/rust/src/gen"
            if [ ! -d "${dir}" ] || [ -z "$(ls -A "${dir}" 2>/dev/null)" ]; then
              echo "::error::${dir} is missing or empty -- buf generate did not run"
              missing=1
            fi
          done
          exit "${missing}"

      # GHCR rejects an uppercase path component, and an owner login may
      # contain one.
      - name: Compute registry namespace
        id: ns
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.ns.outputs.owner }}/${{ matrix.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=${{ matrix.name }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          # A pull request builds but does not publish. Nothing here needs the
          # registry to prove it compiles, and a fork PR has no token anyway.
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # amd64 only, on purpose. The Dockerfile can cross-compile to arm64,
          # but under QEMU a release build of this workspace takes the better
          # part of an hour. Add linux/arm64 here only alongside a native arm
          # runner.
          platforms: linux/amd64
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          # Keeps the published manifest a plain single-arch image rather than
          # an index with an attestation entry, which some tooling renders as a
          # phantom "unknown/unknown" platform.
          provenance: false

      - name: Summarise
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "### ${{ matrix.name }}"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
