name: publish-agents

# Build the Shulker agent plugin jars from THIS fork and publish them as release
# assets.
#
# Why this exists: the operator injects an agent jar URL into every server and
# proxy Pod, defaulting to upstream's Maven at maven.jeremylvln.fr. This fork
# has changed both agents (PlayerMovementService now reports the live player
# count into the Agones `players` counter), so running upstream's published jar
# means the operator declares a counter that nothing ever updates -- Counter
# fleet autoscalers then see zero players forever and never scale on occupancy.
#
# Release assets rather than a Maven repository, deliberately. Upstream's
# `publish` task is hardcoded to maven.jeremylvln.fr and GPG-signs every
# artifact; retargeting it means editing the root build and holding a signing
# key. The consumer here is overbound-gitops' jar-store, which mirrors any URL
# and pins by sha256, so a plain asset download is all that is needed.
#
# Manual trigger only. These jars change rarely and a rebuild that produces
# identical bytes still moves the release, which invalidates the digests pinned
# downstream.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create or replace"
        required: true
        default: agents-v0.13.0

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          # UnifiedMetrics is a composite build under third_party/, not a
          # repository dependency -- without it gradle fails at configuration
          # with an unresolved dev.cubxity.plugins dependency.
          submodules: recursive

      - name: Install tools
        uses: ./.github/actions/install-tools

      # Only the two shaded provider jars, not `build` -- the full build runs
      # detekt and the e2e suite, which are currently failing for reasons that
      # have nothing to do with these artifacts.
      # UnifiedMetrics is vendored as a submodule and consumed from the local
      # Maven repository rather than a public one -- the fork exists to make its
      # Bukkit bootstrap embeddable, and publishing that fork anywhere public
      # would be a release process for a one-word patch.
      - name: Publish UnifiedMetrics to the local repository
        run: |
          cd third_party/unifiedmetrics
          # EVERY module, not just the two platforms. Publishing only those two
          # succeeds and still leaves the build unresolvable: their POMs depend
          # on unifiedmetrics-core and -api, which are then in no repository the
          # agent build can see.
          ./gradlew --no-daemon publishToMavenLocal

      - name: Build agent jars
        env:
          # Without this the root build appends -SNAPSHOT to every version, and
          # the jars come out as shulker-server-agent-0.13.0-SNAPSHOT-paper.jar.
          # The operator asks for the plain version -- it takes it from its own
          # crate version, which has no suffix in a release build -- so a
          # SNAPSHOT filename is a 404 at Pod start. It also changes how the
          # operator resolves the artifact at all: a version ending in -SNAPSHOT
          # sends it to maven-metadata.xml first, which a plain file server does
          # not have.
          IS_RELEASE: "true"
        run: |
          ./gradlew --no-daemon \
            :packages:shulker-server-agent:paperJar \
            :packages:shulker-proxy-agent:velocityJar

      # NOT `dist/` for the output, and NOT `*/build/libs` for the input. This
      # build redirects layout.buildDirectory to dist/java/packages/<name>, so
      # the conventional path does not exist and `dist` is the build tree.
      - name: Collect and checksum
        id: collect
        run: |
          mkdir -p out
          find . -path '*/libs/*.jar' \
                 -name 'shulker-*-agent-*.jar' \
                 ! -name '*-sources.jar' ! -name '*-javadoc.jar' \
                 -exec cp -v {} out/ \;
          # Fail loudly rather than publishing an empty release: a rename
          # upstream would otherwise silently produce a release with no jars,
          # and the digests pinned downstream would keep pointing at the old
          # ones with nothing to say they had gone.
          count=$(ls out/*.jar 2>/dev/null | wc -l)
          if [ "$count" -ne 2 ]; then
            echo "::error::expected 2 agent jars, found $count"
            find . -path '*/libs/*.jar' -print
            exit 1
          fi
          # The digests are what overbound-gitops pins, so print them where they
          # are easy to copy out of the run log.
          (cd out && sha256sum *.jar | tee SHA256SUMS)

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" out/*.jar out/SHA256SUMS \
            --title "Agent jars $TAG" \
            --notes "Built from ${{ github.sha }} by publish-agents.yml. Digests in SHA256SUMS."
          gh release view "$TAG" --json assets --jq '.assets[].url'
