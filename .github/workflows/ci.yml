name: ci

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege by default; jobs opt into more where they genuinely need it.
permissions:
  contents: read

env:
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install tools
        uses: ./.github/actions/install-tools

      - name: Prepare Git boundaries for affected projects
        uses: nrwl/nx-set-shas@v4

      - name: Run build
        run: pnpm exec nx affected --target=build --parallel=1

      - name: Print sccache stats
        shell: bash
        run: ${SCCACHE_PATH} --show-stats

  test:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install tools
        uses: ./.github/actions/install-tools

      # binstall pulls a prebuilt binary instead of compiling the coverage
      # tooling from source on every run.
      - name: Install Rust tools
        run: cargo binstall -y cargo-llvm-cov
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Prepare Git boundaries for affected projects
        uses: nrwl/nx-set-shas@v4

      - name: Run tests
        run: pnpm exec nx affected --target=test --parallel=1

      # One upload for every report. Coverage is attributed back to individual
      # packages by the `component_management` path rules in codecov.yml, which
      # is why there is no longer a generated per-flag upload script.
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: ./coverage
          fail_ci_if_error: false

      - name: Print sccache stats
        shell: bash
        run: ${SCCACHE_PATH} --show-stats

  quality:
    runs-on: ubuntu-latest
    needs: test

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install tools
        uses: ./.github/actions/install-tools

      - name: Install Rust tools
        run: cargo binstall -y cargo-deny clippy-sarif sarif-fmt
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # Blocking. Advisories, license violations and banned/unmaintained crates
      # are build failures, not suggestions -- this is the gate that catches
      # things like an archived serde_yaml sitting in the dependency tree.
      - name: Run cargo-deny
        run: cargo deny check

      - name: Run clippy
        run: cargo clippy --all-features --message-format=json -- --deny warnings | clippy-sarif | tee rust-clippy-results.sarif | sarif-fmt

      # Blocking. `ignoreFailures` is off in the Gradle config, so a new detekt
      # violation that is not in the baseline fails here.
      - name: Run detekt
        run: ./gradlew detektAll

      - name: Upload Clippy analysis results to GitHub
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: rust-clippy-results.sarif
          wait-for-processing: true

      - name: Upload Detekt analysis results to GitHub
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: build/reports/detekt/merge.sarif
          wait-for-processing: true

  lint:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install tools
        uses: ./.github/actions/install-tools

      - name: Prepare Git boundaries for affected projects
        uses: nrwl/nx-set-shas@v4

      - name: Run lint
        run: pnpm exec nx affected --target=lint --parallel=1

      # The generated CRD manifests are a build output of shulker-crds. If they
      # drift from the Rust definitions the Helm chart ships a stale schema.
      - name: Check generated CRDs are up to date
        run: |
          cargo run --bin crdgen
          git diff --exit-code -- kube/helm

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install tools
        uses: ./.github/actions/install-tools

      - name: Install k3d
        run: curl -s https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | TAG=v5.8.3 bash

      # The suite bootstraps its own k3d cluster, builds the operator image,
      # imports it, and installs cert-manager/Agones/Open Match via Helm.
      - name: Run e2e suite
        run: pnpm exec nx run shulker-e2e:e2e

      - name: Upload e2e logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: packages/shulker-e2e/logs
          if-no-files-found: ignore

  semantic:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: read

    if: github.event_name == 'pull_request'

    steps:
      - name: Ensure semantic
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ github.token }}
