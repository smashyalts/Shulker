name: regen-crds

# Regenerate the chart's CRD manifests from the Rust types and commit them.
#
# kube/helm/templates/crds/*.yaml is GENERATED, by packages/shulker-crds'
# `crdgen` binary, which writes straight into the chart. Editing a field on a
# spec struct without re-running it produces the worst kind of mismatch: the
# operator understands the new field, the installed CRD does not, and Kubernetes
# PRUNES it silently on apply. Nothing errors. The object simply comes back
# without what you set, so the Application goes permanently OutOfSync against a
# live resource that is missing it and selfHeal loops forever.
#
# Manual trigger, because it rewrites files in the repository. Run it after any
# change under packages/shulker-crds/src, then rebuild the operator image so the
# two halves ship together.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regen:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Needed: this job pushes. The other workflows here set this false
          # precisely because they do not.
          persist-credentials: true

      - name: Install tools
        uses: ./.github/actions/install-tools

      # crdgen resolves its output paths against ".", so it has to run from the
      # repository root rather than from the package directory.
      - name: Generate CRDs
        run: cargo run --package shulker-crds --bin crdgen

      - name: Commit if anything changed
        run: |
          if git diff --quiet -- kube/helm; then
            echo "CRDs already up to date -- nothing to commit."
            exit 0
          fi
          echo "--- changed ---"
          git diff --stat -- kube/helm
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kube/helm
          git commit -m "chore(crds): regenerate chart manifests from the Rust types

Generated by crdgen via .github/workflows/regen-crds.yml."
          git push
